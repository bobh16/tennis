<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Court Sense</title>
  <meta name="description" content="Tennis open-play matchmaking, scoring and ratings — works offline at the court.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#234f3a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e120d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Court Sense">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app">
    <div class="hwrap">
      <div class="brand">
        <span class="ball" id="brandBall" aria-hidden="true"></span>
        <div>
          <h1 id="brandName">Court Sense</h1>
          <div class="sub" id="brandSub">Open-play matchmaking</div>
        </div>
      </div>
      <div class="courts-ctl">
        <label for="courtTop">Courts</label>
        <select id="courtTop" aria-label="Number of courts">
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
        </select>
      </div>
      <button class="theme-btn" id="settingsBtn" title="Branding & settings" aria-label="Branding and settings">⚙</button>
      <button class="theme-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <nav class="subnav" id="subnav" hidden><div class="subwrap">
    <button class="backbtn" id="homeBtn">← Home</button>
    <span class="subtitle" id="subtitle"></span>
  </div></nav>

  <main>
    <section id="view-home" class="stack"></section>
    <section id="view-tonight" class="stack" hidden></section>
    <section id="view-players" class="stack" hidden></section>
    <section id="view-tournaments" class="stack" hidden></section>
    <section id="view-how" class="stack" hidden></section>
  </main>

  <div id="brandingModal" class="modal" hidden>
    <div class="modal-backdrop" id="brandBackdrop"></div>
    <div class="modal-card">
      <div class="row spread" style="align-items:center">
        <h2 style="font-size:18px">Settings</h2>
        <button class="btn ghost sm" id="brandClose">Close</button>
      </div>
      <label class="field">Club or company name
        <input type="text" id="brandNameInput" placeholder="e.g. Tenneast Academy" autocomplete="off"></label>
      <div class="field"><span>Logo</span>
        <div class="row" style="gap:14px;align-items:center">
          <div class="logo-preview empty" id="brandLogoPreview" aria-hidden="true"></div>
          <div class="row wrap" style="gap:8px">
            <label class="btn sm" style="cursor:pointer">Upload logo<input type="file" id="brandLogoInput" accept="image/*" hidden></label>
            <button class="btn sm ghost" id="brandLogoRemove">Remove</button>
          </div>
        </div>
        <p class="tiny faint" style="margin:6px 0 0">PNG or JPG. Saved on this device.</p>
      </div>
      <div class="field"><span>Cloud sync</span>
        <div class="row" style="gap:10px;align-items:center">
          <button class="btn sm primary" id="syncNow">Sync now</button>
          <span class="tiny muted" id="syncStatus">Not synced yet</span>
        </div>
        <p class="tiny faint" style="margin:6px 0 0">Uploads your roster and tournaments and pulls any changes. Needs internet; the app still works offline.</p>
      </div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn primary" id="brandDone">Done</button>
      </div>
    </div>
  </div>

  <div class="foot">Court Sense · runs offline on this device · Phase 1 (organizer tool)</div>

  <script type="module" src="app.js"></script>
</body>
</html>
